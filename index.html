<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitalPower</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14213d" />
    <script>
      // Set the theme before first paint: the saved choice, else the device setting.
      try { document.documentElement.lang = localStorage.getItem('vp_lang') === 'es' ? 'es' : 'en' } catch (e) { /* storage blocked: use English */ }
      var saved = null
      try { saved = localStorage.getItem('vp_theme') } catch (e) { /* storage blocked: follow the device */ }
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
